trainer: energy

dataset:
  - src: /data2/liud/dataset/Cu_self/IS2RE/od_C2H2O2/tags/train
    normalize_labels: True # 标准化开关
    target_mean: -1.5260
    target_std: 2.2793
  - src: /data2/liud/dataset/Cu_self/IS2RE/od_C2H2O2/tags/val
  - src: /data2/liud/dataset/Cu_self/IS2RE/od_C2H2O2/tags/test_od_C2H2O2


logger: tensorboard

task:
  dataset: trajectory_lmdb
  description: "Regressing to energies and forces for DFT trajectories from OCP"
  type: regression
  metric: mae
  labels:
    - potential energy
  grad_input: atomic forces
  train_on_free_atoms: True
  eval_on_free_atoms: True



