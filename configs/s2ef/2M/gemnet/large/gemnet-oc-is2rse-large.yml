includes:
  - configs/s2ef/2M/base-is2rse.yml

model:
  name: gemnet_is2rse
  num_spherical: 7
  num_radial: 128 #
  num_blocks: 6
  emb_size_atom: 256 #
  emb_size_edge: 1024
  emb_size_trip_in: 64
  emb_size_trip_out: 128
  emb_size_quad_in: 64
  emb_size_quad_out: 32
  emb_size_aint_in: 64
  emb_size_aint_out: 64
  emb_size_rbf: 32
  emb_size_cbf: 16
  emb_size_sbf: 64
  num_before_skip: 2
  num_after_skip: 2
  num_concat: 4
  num_atom: 3
  num_output_afteratom: 3
  cutoff: 8.0
  cutoff_qint: 8.0
  cutoff_aeaint: 8.0
  cutoff_aint: 8.0
  max_neighbors: 30
  max_neighbors_qint: 8
  max_neighbors_aeaint: 20
  max_neighbors_aint: 1000
  rbf:
    name: gaussian
  envelope:
    name: polynomial
    exponent: 5
  cbf:
    name: spherical_harmonics
  sbf:
    name: legendre_outer
  extensive: True
  output_init: HeOrthogonal
  activation: silu
  scale_file: configs/s2ef/all/gemnet/scaling_factors/gemnet-oc-large.pt

#  regress_forces: False
  regress_forces: True
#  direct_forces: False
  direct_forces: True
#  forces_coupled: True
  forces_coupled: False

#  update_v: False # 新增参数，是否预测坐标/向量
  update_v: True
#  update_p: False
  update_p: True

  quad_interaction: False
  atom_edge_interaction: True
  edge_atom_interaction: True
  atom_interaction: True

  num_atom_emb_layers: 2
  num_global_out_layers: 2
  qint_tags: [0, 1]
#  qint_tags: [1, 2]

optim:
  batch_size: 1 # 每个卡的batch大小
  eval_batch_size: 4
  load_balancing: atoms
  eval_every: 1000
  num_workers: 2
  lr_initial: 2.e-4
  optimizer: AdamW
  optimizer_params: {"amsgrad": True}
  scheduler: ReduceLROnPlateau
#  scheduler: CosineAnnealingLR
  mode: min
  factor: 0.8
  patience: 3
  max_epochs: 100
  force_coefficient: 1
  graph_coefficient: 1
  pos_coefficient: 1
  energy_coefficient: 1
  ema_decay: 0.999
  clip_grad_norm: 10
  loss_energy: mae
  loss_force: mae_v
#  loss_vector: mae_v
  loss_vector: mae_v
  weight_decay: 0
#  weight_decay: 0.1
#  T_max: 2000000 # for CosineAnnealingLR
