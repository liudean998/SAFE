trainer: is2rse
dataset:
  - src: dataset/train
    normalize_labels: True
    target_mean: -1.5260
    target_std: 2.2793
  - src: dataset/val
  - src: dataset/test


logger: tensorboard

task:
  dataset: trajectory_lmdb
  type: regression
  metric: mae
  labels:
    positions potential energy
  grad_input: atomic forces
  train_on_free_atoms: True
  eval_on_free_atoms: True
