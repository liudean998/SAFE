trainer: energy

dataset:
  - src: /data2/liud/dataset/OC22/ads/train/
    normalize_labels: False
    target_mean: -523.8716
    target_std: 228.1776
  - src: /data2/liud/dataset/OC22/ads/val/
  - src: /data2/liud/dataset/OC22/is2re/val_ood

logger: tensorboard

task:
  dataset: trajectory_lmdb
  description: "Regressing to energies and forces for DFT trajectories from OCP"
  type: regression
  metric: mae
  labels:
    - potential energy
  grad_input: atomic forces
  train_on_free_atoms: True
  eval_on_free_atoms: True
